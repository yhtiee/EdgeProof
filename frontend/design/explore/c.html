<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exploration C: the canal locks</title>
<link rel="stylesheet" href="/src/styles/fonts.css"><link rel="stylesheet" href="/src/styles/tokens.css">
<style>
  * { box-sizing: border-box } body { margin: 0; background: var(--surface); color: var(--text); font: 16px/26px var(--font-sans) }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 16px } @media (min-width: 1024px) { .wrap { padding: 0 32px } }
  nav { display: flex; justify-content: space-between; align-items: center; height: 64px } .brand { font-weight: 600; font-size: 18px } nav a { color: var(--text-muted); font-size: 14px }
  h1 { font-size: 32px; line-height: 36px; letter-spacing: -.02em; margin: 24px 0 12px; max-width: 20ch } @media (min-width: 768px) { h1 { font-size: 48px; line-height: 52px; margin-top: 48px } }
  p { color: var(--text-muted); max-width: 52ch }
  svg { width: 100%; height: auto; display: block; margin: 24px 0 }
  .btn { display: inline-flex; align-items: center; min-height: 44px; padding: 0 20px; border-radius: 10px; background: var(--accent); color: var(--on-accent); font-weight: 600; text-decoration: none }
  text { font: 13px var(--font-sans); fill: var(--text-muted) }
  .draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: d 2.4s cubic-bezier(.3,0,0,1) forwards } @keyframes d { to { stroke-dashoffset: 0 } }
  @media (prefers-reduced-motion: reduce) { .draw { animation: none; stroke-dashoffset: 0 } }
</style>
</head>
<body>
<div class="wrap">
  <nav><span class="brand">EdgeProof</span><a href="#">Sign in</a></nav>
  <h1>Five gates between you and real money</h1>
  <p>Each gate opens only when your own data meets its criteria. Learn, write your rules, test on unseen data, forward test on demo, then scale slowly.</p>
  <svg viewBox="0 0 1000 220" aria-hidden="true" fill="none">
    <path class="draw" pathLength="1" d="M0 200 H180 V160 H380 V120 H580 V80 H780 V40 H1000" stroke="var(--neutral-data)" stroke-width="2"/>
    <g stroke="var(--text)" stroke-width="2"><path d="M180 150 V210"/><path d="M380 110 V170"/><path d="M580 70 V130"/><path d="M780 30 V90"/></g>
    <circle cx="90" cy="200" r="8" fill="var(--accent)"/>
    <text x="40" y="190">Learn</text><text x="250" y="150">Your rules</text><text x="440" y="110">Unseen data</text><text x="640" y="70">Demo</text><text x="850" y="30">Scale slowly</text>
  </svg>
  <a class="btn" href="#">Create free account</a>
</div>
</body>
</html>
